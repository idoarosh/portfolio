@font-face {
  font-family: 'TheBasics';
  src: url('projects/project 4/TheBasics-Bold.otf');
}

.hebrew-title {
  font-family: 'TheBasics', sans-serif;
  font-size: 1.2em;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-radius: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  background: #ffffff;
  color: #111111;
}

a { text-decoration: none; color: inherit; }
button { background: none; border: none; font-family: inherit; color: inherit; cursor: pointer; }
img { display: block; border-radius: 0; }

/* ── NAV ── */
#nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 40px;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 100;
}

#nav-logo {
  font-size: 14.3px;
  font-weight: bold;
  letter-spacing: normal;
  cursor: pointer;
  user-select: none;
}

#nav-center {
  font-size: 13px;
  font-weight: 400;
  user-select: none;
}

#nav-links {
  display: flex;
  align-items: center;
  gap: 32px;
  font-size: 13px;
}

#nav-links span {
  cursor: pointer;
  font-weight: 400;
  user-select: none;
}

#nav-links span.active {
  font-weight: 700;
}

#nav-about-asterisk {
  display: none;
  font-size: 13px;
  font-weight: 400;
  margin-right: 6px;
}

/* ── FOOTER ── */
#footer {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 32px;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 100;
  font-size: 9.35px;
  font-weight: 400;
  color: #111111;
}

/* ── VIEWS ── */
.view {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 250ms ease;
}

.view.active {
  opacity: 1;
  pointer-events: all;
}

/* ── IMAGE STRIP SHARED ── */
.strip-wrapper {
  position: absolute;
  top: 40px;
  left: 0; right: 0;
  bottom: 96px; /* 64px label zone + 32px footer - giving more space below images */
  overflow: hidden;
}

.strip {
  display: flex;
  flex-direction: row;
  height: 100%;
  gap: 8px;
}

.strip-tile {
  height: 100%;
  flex-shrink: 0;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: filter 0.3s ease;
}

#view-home .strip-tile {
  filter: brightness(0.85);
}

.strip-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

/* ── LABEL ZONE ── */
.label-zone {
  position: fixed;
  bottom: 32px;
  left: 0; right: 0;
  height: 64px;
  display: flex;
  align-items: center;
  background: #ffffff;
  z-index: 50;
  pointer-events: none;
}

.project-label {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  pointer-events: none;
  white-space: nowrap;
}

.project-label .lbl-asterisk {
  font-size: 11px;
  font-weight: 400;
}

.project-label .lbl-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
}

.project-label .lbl-subtitle {
  font-size: 9px;
  font-weight: 400;
  color: #666666;
  text-transform: uppercase;
}

/* ── PROJECT META BAR ── */
.meta-zone {
  position: fixed;
  bottom: 32px;
  left: 0; right: 0;
  height: 64px;
  display: flex;
  align-items: flex-start;
  background: #ffffff;
  padding: 22px 24px 0 24px;
  z-index: 50;
}

.meta-left {
  display: flex;
  flex-direction: column;
  gap: 0;
  justify-content: flex-start;
  min-width: 160px;
}

.meta-left .m-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  line-height: 1.3;
}

.meta-left .m-year {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.3;
}

.meta-center {
  margin-left: 50px;
  font-size: 13px;
  font-weight: 400;
  max-width: 600px;
}

.meta-note {
  margin-left: auto;
  font-size: 11px;
  font-weight: 400;
  color: #888888;
  max-width: 320px;
  text-align: right;
}

/* ── GALLERY MODE FOR PROJECT VIEW ── */
#view-project.is-gallery #proj-meta-zone {
  display: none;
}
#view-project.is-gallery #proj-label-zone {
  display: flex;
}
#view-project.is-gallery #proj-strip-wrapper {
  bottom: 96px; 
}


/* ── ABOUT VIEW ── */
#view-about {

  left: 0; right: 0;
  bottom: 32px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 80px 24px;
  background: #ffffff;
}

#view-about .about-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  width: 100%;
}

.about-profile-pic {
  grid-column: 1 / 2;
  width: 200px;
  height: 200px;
  object-fit: cover;
  align-self: start;
  margin-top: 5px; /* aligns image with the text baseline visual */
}

.about-bio {
  grid-column: 2 / 5;
  display: flex;
  flex-direction: column;
  gap: 28px;
  justify-content: center;
}

.about-bio p {
  font-size: clamp(16px, 1.4vw, 20px);
  font-weight: 700;
  line-height: 1.5;
  color: #111111;
  max-width: 48ch;
}

.about-section-gap {
  grid-column: 1 / -1;
  height: 100px;
}

.about-section-gap-sm {
  grid-column: 1 / -1;
  height: 80px;
}

.about-section-label {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding-top: 4px;
  grid-column: 1 / 2;
}

.about-details-wrapper {
  grid-column: 2 / 5;
  display: flex;
  gap: 80px;
}

.about-detail-col {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.detail-top-label {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.font-row {
  display: flex;
  align-items: baseline;
  gap: 48px;
}

.font-hebrew {
  font-family: 'David', sans-serif;
  font-size: 38px;
  line-height: 1;
  letter-spacing: -1.5px;
}

.font-english {
  font-family: 'Helvetica', sans-serif;
  font-size: 38px;
  font-weight: bold;
  line-height: 1;
  letter-spacing: -2px;
}

.pallet-row {
  display: flex;
  gap: 10px;
}

.pallet-color {
  width: 64px;
  height: 64px;
}


.services-col span {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.8;
}

.contact-item {
  display: flex;
  flex-direction: column;
}

.about-contact-items {
  grid-column: 2 / 5;
  display: flex;
  gap: 60px;
  align-items: flex-start;
}

.contact-item .c-label {
  font-size: 13px;
  font-weight: 400;
  margin-bottom: 4px;
}

.contact-item .c-value {
  font-size: 15px;
  font-weight: 700;

    top: 36px;

  }

  .desktop-br {
    display: none;

  #view-about .about-grid {
    grid-template-columns: 1fr;
  }

  .about-profile-pic {
    grid-column: 1;
    width: 120px;
    height: 120px;
    margin-bottom: 24px;
  }

  .about-bio {
    grid-column: 1;
    gap: 20px;
  }

  .about-bio p {
    font-size: 14px;
    max-width: none;
  }

  .about-section-gap { height: 60px; }
  .about-section-gap-sm { height: 40px; }

  .about-section-label {
    grid-column: 1;
    margin-bottom: 12px;
  }

  .about-details-wrapper {
    grid-column: 1;
    flex-direction: column;
    gap: 32px;
  }

  .font-row { gap: 24px; }
  .font-hebrew { font-size: 28px; }
  .font-english { font-size: 28px; }

  .about-contact-items {
    grid-column: 1;
    flex-direction: column;
    gap: 20px;
  }

  .contact-item .c-value {
    font-size: 13px;
  }
}

/* ── EASTER EGG ── */
@keyframes easterEggPop {
  from { opacity: 0; transform: scale(0) rotate(var(--r)); }
  to   { opacity: 1; transform: scale(1) rotate(var(--r)); }
}
</style>

// ── DATA ──────────────────────────────────────────────────────────────────────

    coverImage: "projects/Project 6/COVER .png?v=3",

      { url: "projects/Project 6/Blue Serpent .png?v=5", ratio: 3.51 }
    ]

];

const about = {
  symbol: "*",
  bio: [
    "I’m a second-year Visual Communication student at Shenkar, originally from Moshav Brosh and based in Tel Aviv for the past four years.",
    "I’m the kind of person who notices bad kerning before noticing the weather, which probably explains a lot. Since May 2022, I’ve been paying my bills through Haaretz newspaper, developing visual concepts and graphics for conferences and events, alongside layout work for the newspaper. I now continue there as a student designer at the Ads Studio.",
    "I also work with private clients on graphics, ads, and visual content, so there’s a small chance one of my designs once made you crave a bottle of wine."
  ],
  services: [
    ["Graphic Design", "Motion Design", "Web Design"],
    ["Art Direction", "Creative Direction", "Visual Identity"],
    ["Photography", "Moving Images"]
  ],
  contact: [
    { label: "Email", value: "idoarosh@gmail.com" },
    { label: "Phone", value: "054-2454201" },
    { label: "Instagram", value: "@designbyido" }
  ]
};

// ── STATE ─────────────────────────────────────────────────────────────────────────
let currentView = 'home';
let activeStripId = 'home-strip';

// ── SCROLL ENGINE (unified for desktop + mobile) ─────────────────────────
let targetX = 0;
let currentX = 0;
let maxScroll = 0;
let savedTargetX = 0;
let wasDragging = false;

// Touch state
let touchStartX = 0;
let touchStartY = 0;
let lastTouchX = 0;
let lastTouchY = 0;
let velocity = 0;
let isDragging = false;
let directionLocked = false;

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

function getMaxScroll(stripId) {
  const strip = document.getElementById(stripId);
  if (!strip) return 0;
  const tiles = strip.querySelectorAll('.strip-tile');
  if (tiles.length === 0) return 0;
  const gap = parseInt(getComputedStyle(strip).gap) || 8;
  let totalWidth = 0;
  tiles.forEach((t, i) => {
    totalWidth += t.offsetWidth;
    if (i < tiles.length - 1) totalWidth += gap;
  });
  return Math.max(0, totalWidth - strip.parentElement.offsetWidth);
}

function recalcMaxScroll() {
  maxScroll = getMaxScroll(activeStripId);
}

// ── NAV STATE ─────────────────────────────────────────────────────────────────
function setNavState(view) {
  const navProjects = document.getElementById('nav-projects');
  const navAbout = document.getElementById('nav-about');
  const navAsterisk = document.getElementById('nav-about-asterisk');

  navProjects.classList.remove('active');
  navAbout.classList.remove('active');
  navAsterisk.style.display = 'none';

  if (view === 'home') {
    navProjects.classList.add('active');
  } else if (view === 'about') {
    navAsterisk.style.display = 'inline';
    navAbout.classList.add('active');
  }
}

// ── VIEW SWITCHER ─────────────────────────────────────────────────────────────
function switchView(id) {
  document.querySelectorAll('.view').forEach(v => {
    v.classList.remove('active');
  });
  const el = document.getElementById(id);
  el.classList.add('active');
  currentView = id.replace('view-', '');
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function buildHome() {
  const strip = document.getElementById('home-strip');
  const labelZone = document.getElementById('home-label-zone');

  strip.innerHTML = '';
  labelZone.innerHTML = '';

  const stripHeight = strip.parentElement.offsetHeight;

  projects.forEach((p, i) => {
    const coverRatios = [0.64, 0.8, 0.65, 0.8, 0.8, 0.6];
    const mobileMultipliers = [1.08, 0.85, 1.10, 1.10, 1.0, 1.0];
    const desktopMultipliers = [1.10, 0.85, 1.0, 1.0, 1.0, 1.0];
    const ratio = coverRatios[i] || 1.0;
    const isMobile = window.innerWidth <= 768;
    const mult = isMobile ? (mobileMultipliers[i] || 1.0) : (desktopMultipliers[i] || 1.0);
    const w = stripHeight * ratio * mult;

    const tile = document.createElement('div');
    tile.className = 'strip-tile';
    tile.style.width = w + 'px';
    tile.dataset.index = i;
    const img = document.createElement('img');
    img.src = p.coverImage;
    img.alt = p.title;
    img.loading = 'lazy';
    tile.appendChild(img);
    tile.addEventListener('click', () => {
      if (wasDragging) return;
      showProject(p);
      window.history.pushState({}, '', '#project/' + p.id);
    });

    tile.addEventListener('mouseenter', () => {
      const allTiles = strip.querySelectorAll('.strip-tile');
      allTiles.forEach(t => {
        t.style.filter = t === tile ? 'brightness(1.0)' : 'brightness(0.75)';
      });
    });

    strip.appendChild(tile);
  });

  strip.addEventListener('mouseleave', () => {
    strip.querySelectorAll('.strip-tile').forEach(t => {
      t.style.filter = 'brightness(0.85)';
    });
  });

  requestAnimationFrame(() => {
    recalcMaxScroll();
    // Recreate labels
    projects.forEach((p, i) => {
      const label = document.createElement('div');
      label.className = 'project-label';
      const title = document.createElement('span');
      title.className = 'lbl-title';
      title.innerHTML = p.title;
      label.appendChild(title);
      if (p.subtitle) {
        const subtitle = document.createElement('span');
        subtitle.className = 'lbl-subtitle';
        subtitle.innerHTML = p.subtitle;
        label.appendChild(subtitle);
      }
      labelZone.appendChild(label);
    });
    updateLabelsFromX(currentX);
  });
}

function updateLabelsFromX(x, stripId = 'home-strip', labelZoneId = 'home-label-zone') {
  const strip = document.getElementById(stripId);
  const labelZone = document.getElementById(labelZoneId);
  if (!strip || !labelZone || labelZone.style.display === 'none') return;
  const labels = labelZone.querySelectorAll('.project-label');
  const tiles = strip.querySelectorAll('.strip-tile');

  const isMobile = window.innerWidth <= 768;

  if (isMobile) {
    labelZone.style.transform = `translateX(${-x}px)`;
    tiles.forEach((tile, i) => {
      if (labels[i]) {
        labels[i].style.width = tile.offsetWidth + 'px';
        labels[i].style.left = '';
      }
    });
  } else {
    labelZone.style.transform = 'none';
    tiles.forEach((tile, i) => {
      const tileLeft = tile.offsetLeft - x;
      if (labels[i]) {
        labels[i].style.width = '';
        labels[i].style.left = (tileLeft + (i === 0 ? 24 : 0)) + 'px';
      }
    });
  }
}

function positionLabels() {
  const strip = document.getElementById('home-strip');
  const labelZone = document.getElementById('home-label-zone');
  labelZone.innerHTML = '';

  const tiles = strip.querySelectorAll('.strip-tile');
  const isMobile = window.innerWidth <= 768;

  tiles.forEach((tile, i) => {
    const p = projects[i];
    const tileLeft = tile.offsetLeft - currentX;

    const label = document.createElement('div');
    label.className = 'project-label';
    if (isMobile) {
      label.style.width = tile.offsetWidth + 'px';
    } else {
      label.style.left = (tileLeft + (i === 0 ? 24 : 0)) + 'px';
    }

    const title = document.createElement('span');
    title.className = 'lbl-title';
    title.innerHTML = p.title;
    label.appendChild(title);

    if (p.subtitle) {
      const subtitle = document.createElement('span');
      subtitle.className = 'lbl-subtitle';
      subtitle.innerHTML = p.subtitle;
      label.appendChild(subtitle);
    }

    labelZone.appendChild(label);
  });

  if (isMobile) {
    labelZone.style.transform = `translateX(${-currentX}px)`;
  } else {
    labelZone.style.transform = 'none';
  }
}

function scrollToProject(index) {
  const strip = document.getElementById('home-strip');
  const tiles = strip.querySelectorAll('.strip-tile');
  if (tiles[index]) {
    targetX = clamp(tiles[index].offsetLeft, 0, maxScroll);
  }
}

// ── rAF ANIMATION LOOP ──────────────────────────────────────────────────────
function animate() {
  currentX = targetX;

  const strip = document.getElementById(activeStripId);
  if (strip) {
    strip.style.transform = `translateX(${-currentX}px)`;
  }

  if (currentView === 'home') {
    updateLabelsFromX(currentX, 'home-strip', 'home-label-zone');
  } else if (currentView === 'project' && document.getElementById('view-project').classList.contains('is-gallery')) {
    updateLabelsFromX(currentX, 'proj-strip', 'proj-label-zone');
  }

  requestAnimationFrame(animate);
}

// ── WHEEL SCROLL ─────────────────────────────────────────────────────────────
function setupWheelScroll() {
  window.addEventListener('wheel', (e) => {
    if (currentView === 'about') return;
    e.preventDefault();
    const delta = e.deltaY + e.deltaX;
    targetX = clamp(targetX + delta, 0, maxScroll);
  }, { passive: false });
}

// ── TOUCH SCROLL ─────────────────────────────────────────────────────────────
// Vertical swipe → horizontal strip scroll (like desktop wheel)
function setupTouchScroll() {
  const wrappers = [
    document.getElementById('home-strip-wrapper'),
    document.getElementById('proj-strip-wrapper')
  ];

  wrappers.forEach(wrapper => {
    wrapper.addEventListener('touchstart', (e) => {
      if (currentView === 'about') return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      lastTouchY = touchStartY;
      lastTouchX = touchStartX;
      isDragging = false;
      directionLocked = false;
    }, { passive: true });

    wrapper.addEventListener('touchmove', (e) => {
      if (currentView === 'about') return;

      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;

      if (!directionLocked) {
        if (Math.abs(dy) > Math.abs(dx) + 4) {
          // Vertical swipe — lock to horizontal strip scroll
          isDragging = true;
          directionLocked = true;
        } else if (Math.abs(dx) > Math.abs(dy) + 4) {
          // Horizontal swipe — also scroll the strip
          isDragging = true;
          directionLocked = true;
        }
      }

      if (isDragging) {
        e.preventDefault();
        const deltaY = lastTouchY - e.touches[0].clientY;
        const deltaX = lastTouchX - e.touches[0].clientX;
        const delta = deltaY + deltaX;
        targetX = clamp(targetX + delta * 2.5, 0, maxScroll);
        currentX = targetX;
        lastTouchY = e.touches[0].clientY;
        lastTouchX = e.touches[0].clientX;
      }
    }, { passive: false });

    wrapper.addEventListener('touchend', (e) => {
      if (isDragging) {
        wasDragging = true;
        setTimeout(() => { wasDragging = false; }, 300);
      }
      isDragging = false;
    }, { passive: true });
  });
}

// ── PROJECT VIEW ──────────────────────────────────────────────────────────────
function showProject(project) {
  savedTargetX = targetX;

  const viewProject = document.getElementById('view-project');
  const labelZone = document.getElementById('proj-label-zone');
  const strip = document.getElementById('proj-strip');
  strip.innerHTML = '';
  strip.style.transform = 'translateX(0px)';

  if (project.isGallery) {
    viewProject.classList.add('is-gallery');
    labelZone.style.display = 'flex';
    labelZone.innerHTML = '';
  } else {
    viewProject.classList.remove('is-gallery');
    labelZone.style.display = 'none';
  }

  const stripHeight = strip.parentElement.offsetHeight;

  project.images.forEach((im, i) => {
    const w = stripHeight * im.ratio;
    const tile = document.createElement('div');
    tile.className = 'strip-tile';
    tile.style.width = w + 'px';
    tile.style.cursor = 'default';
    
    const cleanUrl = im.url.split('?')[0].toLowerCase();
    if (cleanUrl.endsWith('.mp4') || cleanUrl.endsWith('.mov')) {
      const vid = document.createElement('video');
      vid.src = im.url;
      vid.autoplay = true;
      vid.loop = true;
      vid.muted = true;
      vid.playsInline = true;
      vid.style.width = '100%';
      vid.style.height = '100%';
      vid.style.objectFit = 'cover';
      vid.style.pointerEvents = 'none';
      tile.appendChild(vid);
    } else {
      const img = document.createElement('img');
      img.src = im.url;
      img.alt = '';
      img.loading = 'lazy';
      tile.appendChild(img);
    }
    strip.appendChild(tile);

    if (project.isGallery && project.imageLabels && project.imageLabels[i]) {
      const lbl = project.imageLabels[i];
      const label = document.createElement('div');
      label.className = 'project-label';
      const title = document.createElement('span');
      title.className = 'lbl-title';
      title.innerHTML = lbl.title;
      label.appendChild(title);
      if (lbl.subtitle) {
        const subtitle = document.createElement('span');
        subtitle.className = 'lbl-subtitle';
        subtitle.innerHTML = lbl.subtitle;
        label.appendChild(subtitle);
      }
      labelZone.appendChild(label);
    }
  });

  if (!project.isGallery) {
    document.getElementById('proj-title').innerHTML = project.title;
    document.getElementById('proj-desc').innerHTML = project.description;
    const noteEl = document.getElementById('proj-note');
    noteEl.textContent = project.note || '';
    noteEl.style.display = project.note ? 'block' : 'none';
  }

  activeStripId = 'proj-strip';
  targetX = 0;
  currentX = 0;
  requestAnimationFrame(() => {
    recalcMaxScroll();
    if (project.isGallery) {
      updateLabelsFromX(0, 'proj-strip', 'proj-label-zone');
    }
  });

  setNavState('project');
  switchView('view-project');
}

// ── HOME (RETURN) ─────────────────────────────────────────────────────────────
function showHome(push) {
  activeStripId = 'home-strip';
  targetX = savedTargetX;
  currentX = savedTargetX;

  setNavState('home');
  switchView('view-home');

  requestAnimationFrame(() => {
    recalcMaxScroll();
    const strip = document.getElementById('home-strip');
    strip.style.transform = `translateX(${-currentX}px)`;
    updateLabelsFromX(currentX, 'home-strip', 'home-label-zone');
  });
  if (push !== false) window.history.pushState({}, '', '#');
}

// ── ABOUT VIEW ────────────────────────────────────────────────────────────────
function buildAbout() {
  const grid = document.getElementById('about-grid');
  grid.innerHTML = '';

  // Section 1 — Identity
  const profilePic = document.createElement('img');
  profilePic.className = 'about-profile-pic';
  profilePic.src = 'projects/About/Main new.png';
  profilePic.alt = 'Ido Arosh';
  profilePic.style.cursor = 'pointer';
  profilePic.addEventListener('click', () => triggerEasterEgg(profilePic));
  grid.appendChild(profilePic);

  const bioBlock = document.createElement('div');
  bioBlock.className = 'about-bio';
  about.bio.forEach(b => {
    const p = document.createElement('p');
    p.innerHTML = b;
    bioBlock.appendChild(p);
  });
  grid.appendChild(bioBlock);

  // Gap
  const gap1 = document.createElement('div');
  gap1.className = 'about-section-gap';
  grid.appendChild(gap1);

  // Section 2 — Personal Details (Fonts & Pallet)
  const detailsWrapper = document.createElement('div');
  detailsWrapper.className = 'about-details-wrapper';

  detailsWrapper.innerHTML = `
    <div class="about-detail-col">
      <div class="detail-top-label">favorite fonts</div>
      <div class="font-row">
        <div class="font-hebrew">דויד</div>
        <div class="font-english">Helvetica</div>
      </div>
    </div>
  `;
  grid.appendChild(detailsWrapper);

  // Gap
  const gap2 = document.createElement('div');
  gap2.className = 'about-section-gap-sm';
  grid.appendChild(gap2);

  // Section 3 — Contact
  const ctLabel = document.createElement('div');
  ctLabel.className = 'about-section-label';
  ctLabel.textContent = 'Contact';
  grid.appendChild(ctLabel);

  const contactItemsWrapper = document.createElement('div');
  contactItemsWrapper.className = 'about-contact-items';

  about.contact.forEach(c => {
    const item = document.createElement('div');
    item.className = 'contact-item';
    const label = document.createElement('div');
    label.className = 'c-label';
    label.textContent = c.label;
    const value = document.createElement('div');
    value.className = 'c-value';
    value.textContent = c.value;
    item.appendChild(label);
    item.appendChild(value);
    contactItemsWrapper.appendChild(item);
  });
  grid.appendChild(contactItemsWrapper);
}

function showAbout(push) {
  if (activeStripId === 'home-strip') {
    savedTargetX = targetX;
  }
  activeStripId = null;
  setNavState('about');
  switchView('view-about');
  if (push !== false) window.history.pushState({}, '', '#about');
}

// ── EASTER EGG ────────────────────────────────────────────────────────────────
let easterEggActive = false;

function triggerEasterEgg(sourceImg) {
  if (easterEggActive) return;
  easterEggActive = true;

  // Create overlay container
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;';
  document.body.appendChild(overlay);

  const clones = [];
  let spawned = 0;
  const totalClones = 40;

  // PHASE 1 — FLOOD (0ms to 1000ms)
  const spawnInterval = setInterval(() => {
    if (spawned >= totalClones) {
      clearInterval(spawnInterval);
      return;
    }

    const clone = document.createElement('img');
    clone.src = sourceImg.src;
    clone.alt = '';

    const size = 50 + Math.random() * 110; // 50–160px
    const rotation = -30 + Math.random() * 60; // -30 to 30 deg

    clone.style.cssText = `
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      width: ${size}px;
      height: auto;
      top: ${-5 + Math.random() * 110}vh;
      left: ${-5 + Math.random() * 110}vw;
      animation: easterEggPop 200ms ease-out forwards;
      transition: opacity 400ms ease-in, transform 400ms ease-in;
    `;
    clone.style.setProperty('--r', rotation + 'deg');

    overlay.appendChild(clone);
    clones.push(clone);
    spawned++;
  }, 25);

  // PHASE 2 — HOLD (1000ms to 3000ms) — nothing happens

  // PHASE 3 — DISAPPEAR (3000ms to 3400ms)
  setTimeout(() => {
    clones.forEach(clone => {
      clone.style.opacity = '0';
      clone.style.transform = `scale(0.7) rotate(${clone.style.getPropertyValue('--r')})`;
    });

    // Cleanup after transition completes
    setTimeout(() => {
      overlay.remove();
      easterEggActive = false;
    }, 400);
  }, 3000);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
buildHome();
buildAbout();
setupWheelScroll();
setupTouchScroll();
requestAnimationFrame(() => {
  recalcMaxScroll();
  positionLabels();
  animate();
});

// Reposition on resize
window.addEventListener('resize', () => {
  buildHome();
  recalcMaxScroll();
  targetX = clamp(targetX, 0, maxScroll);
  currentX = targetX;
  const strip = document.getElementById(activeStripId);
  if (strip) strip.style.transform = `translateX(${-currentX}px)`;
  positionLabels();
  if (currentView === 'project' && document.getElementById('view-project').classList.contains('is-gallery')) {
    updateLabelsFromX(currentX, 'proj-strip', 'proj-label-zone');
  }
});
// ── HISTORY API ──────────────────────────────────────────────────────────────
window.addEventListener('popstate', () => {
  const hash = window.location.hash;
  if (!hash || hash === '#' || hash === '') {
    showHome(false);
  } else if (hash === '#about') {
    showAbout(false);
  } else if (hash.startsWith('#project/')) {
    const id = hash.split('#project/')[1];
    const project = projects.find(p => p.id === id);
    if (project) {
      showProject(project);
    } else {
      showHome(false);
    }
  }
});
